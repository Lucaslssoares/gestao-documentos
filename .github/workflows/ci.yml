name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build e testes (front-end e back-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24" # Node 20 saiu de suporte em abr/2026
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install dependencies (frontend)
        run: npm ci
        working-directory: frontend
      - name: Lint (frontend)
        run: npm run lint
        working-directory: frontend
      - name: Run tests (frontend)
        run: npm test
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder

      - name: Install dependencies (backend)
        run: npm ci
        working-directory: backend
      - name: Lint (backend)
        run: npm run lint
        working-directory: backend
      - name: Typecheck (backend)
        run: npm run typecheck
        working-directory: backend
      - name: Run tests (backend)
        run: npm test
        working-directory: backend
      - name: Build backend
        run: npm run build
        working-directory: backend

      # O docker-compose lê o .env; no CI usamos os valores de exemplo.
      - name: Build Docker images
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose build

  database:
    name: Banco (migrations + testes de RLS com pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Start database (migrations + seed)
        run: supabase db start
      - name: Run pgTAP tests
        run: supabase test db

  deploy:
    name: Deploy (imagens no GitHub Container Registry)
    needs: [build-and-test, database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # "secrets" não pode ser usado direto em "if:" de um passo.
      TEM_SERVIDOR: ${{ secrets.DEPLOY_HOST != '' }}
    steps:
      - uses: actions/checkout@v7
      # O GHCR exige nomes de imagem em minúsculas (o dono do repositório pode ter maiúsculas).
      - name: Image owner (lowercase)
        run: echo "DONO_IMAGEM=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.DONO_IMAGEM }}/gestao-documentos-backend:latest
            ghcr.io/${{ env.DONO_IMAGEM }}/gestao-documentos-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          # Valores públicos do Supabase de produção (Settings → Secrets and variables → Actions → Variables).
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
          tags: |
            ghcr.io/${{ env.DONO_IMAGEM }}/gestao-documentos-frontend:latest
            ghcr.io/${{ env.DONO_IMAGEM }}/gestao-documentos-frontend:${{ github.sha }}

      # Publicação no servidor: crie os secrets DEPLOY_HOST, DEPLOY_USER e DEPLOY_SSH_KEY.
      # Enquanto não houver servidor definido, o passo é pulado.
      - name: Deploy no servidor (docker compose pull + up)
        if: env.TEM_SERVIDOR == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/gestao-documentos && docker compose pull && docker compose up -d --no-build --remove-orphans"
